name: Source Platform Smoke

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tkinter installieren (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Kern-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests psutil Pillow intervaltree ttkbootstrap aiohttp scipy pytest

      - name: Plattform-Smoke ausführen
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests/source_platform_smoke.py -v
