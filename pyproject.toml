[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vfdistiller"
version = "17.0.2"
description = "Local-first bioinformatics desktop tool for research-grade genetic variant filtering, annotation, and conversion (VCF, gVCF, 23andMe, FASTA)."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
requires-python = ">=3.10"
authors = [
    {name = "Lukas Geiger", email = "support@lukasgeiger.com"},
    {name = "Lukas Geiger", email = "lukas@open-bricks.org"}
]
keywords = [
    "bioinformatics",
    "vcf",
    "gvcf",
    "genomics",
    "variant-annotation",
    "23andme",
    "fasta",
    "biotec-line",
    "open-bricks",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "requests>=2.32.3",
    "psutil>=5.9.0",
    "Pillow>=10.3.0",
    "intervaltree>=3.1.0",
    "ttkbootstrap>=1.10.0",
    "pystray>=0.19.0",
    "aiohttp>=3.10.11",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]
test = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]
export = [
    "openpyxl>=3.1.3",
    "reportlab>=4.0.0",
]
extended = [
    "numpy>=1.24.0",
    "biopython>=1.81",
    "pyfaidx>=0.7.0",
]
all = [
    "openpyxl>=3.1.3",
    "reportlab>=4.0.0",
    "numpy>=1.24.0",
    "biopython>=1.81",
    "pyfaidx>=0.7.0",
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/biotec-line/VFDistiller"
Repository = "https://github.com/biotec-line/VFDistiller"
Documentation = "https://github.com/biotec-line/VFDistiller#readme"
Issues = "https://github.com/biotec-line/VFDistiller/issues"
Changelog = "https://github.com/biotec-line/VFDistiller/blob/main/CHANGELOG.md"
Security = "https://github.com/biotec-line/VFDistiller/blob/main/SECURITY.md"
"Third-Party Licenses" = "https://github.com/biotec-line/VFDistiller/blob/main/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/biotec-line/VFDistiller/blob/main/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/biotec-line/VFDistiller/blob/main/llms.txt"
"Parent Organization" = "https://github.com/biotec-line"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -v"
norecursedirs = [
    "releases",
    "build",
    "dist",
    "_archive",
    ".venv",
    "venv",
    "__pycache__",
    "codex_build",
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    "Variant_Fusion_pro_V17.py",
    "cython_hotpath",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
