name: Source Platform Smoke

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Tkinter on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests psutil Pillow intervaltree ttkbootstrap aiohttp scipy pytest

      - name: Run platform smoke
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests/source_platform_smoke.py -v
