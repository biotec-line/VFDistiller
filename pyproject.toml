[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vfdistiller"
version = "1.7.0"
description = "Local-first bioinformatics desktop application for processing, converting, and annotating VCF, gVCF, 23andMe raw text, and FASTA variant data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "biotec-line maintainers", email = "lukas@um-bruch.org" }
]
keywords = [
    "bioinformatics", "vcf", "gvcf", "genomics", "variant-annotation",
    "23andme", "fasta", "gnomad", "clinvar", "local-first"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "Pillow>=10.0.0",
    "intervaltree>=3.1.0",
    "ttkbootstrap>=1.10.0",
    "pystray>=0.19.0",
    "aiohttp>=3.9.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
export = [
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
]
extended = [
    "numpy>=1.24.0",
    "biopython>=1.81",
    "pyfaidx>=0.7.0",
]
test = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/biotec-line/VFDistiller"
Documentation = "https://github.com/biotec-line/VFDistiller#readme"
Repository = "https://github.com/biotec-line/VFDistiller"
Issues = "https://github.com/biotec-line/VFDistiller/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
