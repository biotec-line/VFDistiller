<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="vBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0d182e" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d8d6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="funnelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d8d6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <filter id="vGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#vBgGrad)" rx="12" />

  <!-- Tech Grid Background -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M0,50 L1200,50 M0,100 L1200,100 M0,150 L1200,150 M0,200 L1200,200 M0,250 L1200,250" />
    <path d="M200,0 L200,300 M400,0 L400,300 M600,0 L600,300 M800,0 L800,300 M1000,0 L1000,300" />
  </g>

  <!-- Background Glow Orbs -->
  <circle cx="980" cy="140" r="140" fill="#00d8d6" opacity="0.1" filter="url(#vGlow)" />
  <circle cx="860" cy="200" r="90" fill="#6366f1" opacity="0.12" filter="url(#vGlow)" />

  <!-- Distillation Node Graphic (Right Side) -->
  <g transform="translate(860, 30)">
    <!-- Funnel / Distillation Rays -->
    <polygon points="20,20 180,20 120,160 80,160" fill="url(#funnelGrad)" opacity="0.25" />
    <line x1="20" y1="20" x2="80" y2="160" stroke="#00d8d6" stroke-width="3" filter="url(#vGlow)" />
    <line x1="180" y1="20" x2="120" y2="160" stroke="#38bdf8" stroke-width="3" filter="url(#vGlow)" />
    
    <!-- Distilled Stream Output -->
    <rect x="94" y="160" width="12" height="70" fill="url(#cyanGrad)" rx="6" filter="url(#vGlow)" />
    <circle cx="100" cy="245" r="12" fill="#a855f7" filter="url(#vGlow)" />

    <!-- Variant Nodes (Input Layer) -->
    <circle cx="30" cy="20" r="7" fill="#f43f5e" />
    <circle cx="70" cy="20" r="7" fill="#10b981" />
    <circle cx="110" cy="20" r="7" fill="#00d8d6" />
    <circle cx="150" cy="20" r="7" fill="#f59e0b" />
    <circle cx="170" cy="20" r="7" fill="#6366f1" />

    <!-- Mid Layer Filtering Nodes -->
    <circle cx="60" cy="80" r="6" fill="#10b981" />
    <circle cx="100" cy="80" r="7" fill="#00d8d6" />
    <circle cx="140" cy="80" r="6" fill="#6366f1" />

    <!-- Filtered Output Node -->
    <circle cx="100" cy="160" r="8" fill="#00d8d6" filter="url(#vGlow)" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(70, 0)">
    <!-- Category Badge -->
    <rect x="0" y="42" width="250" height="28" rx="14" fill="#00d8d6" fill-opacity="0.15" stroke="#00d8d6" stroke-opacity="0.4" stroke-width="1" />
    <text x="15" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#00d8d6" letter-spacing="1.5">BIOTEC-LINE • VARIANTS &amp; ANNOTATION</text>

    <!-- Main Title -->
    <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.5">VF<tspan fill="url(#cyanGrad)">Distiller</tspan></text>

    <!-- Subtitle -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">Variant Fusion Distiller • Research-Grade Local Genomic Variant Pipeline</text>

    <!-- Feature Badges -->
    <g transform="translate(0, 195)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="160" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">🔬 VCF &amp; gVCF Filtering</text>

      <!-- Badge 2 -->
      <rect x="172" y="0" width="180" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="186" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">📊 Offline Annotation</text>

      <!-- Badge 3 -->
      <rect x="364" y="0" width="170" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="378" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">🔒 Local-First Privacy</text>
    </g>
  </g>
</svg>
